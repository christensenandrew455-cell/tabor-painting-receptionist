name: Apply Contact Consent Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-contact-consent.yml"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Mark consent patch pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Consent Patch',
              description: 'Applying caller contact-consent gate',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply contact-consent changes
        run: python scripts/apply-contact-consent.py

      - name: Install dependencies
        run: npm install

      - name: Validate receptionist
        run: |
          npm run check
          npm test

      - name: Commit contact-consent gate
        run: |
          git config user.name "ARK GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add receptionist-script.js receptionist-core.js server.js test/receptionist.test.js ocm-bootstrap.js
          git commit -m "Require caller consent before saving leads"
          git push origin main

      - name: Mark consent patch successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Consent Patch',
              description: 'Caller contact-consent gate applied and tested',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark consent patch failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Consent Patch',
              description: 'Caller contact-consent patch failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
